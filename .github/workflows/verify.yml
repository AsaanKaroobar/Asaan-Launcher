name: Checkpoint validation
on:
  push:
    branches: [main, 'checkpoint-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-2022
            bundle: nsis
          - os: macos-14
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb xauth kwin-x11 x11-utils libxtst6 imagemagick python3 python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 dolphin
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run native:check
      - name: Package native application
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Install and smoke test Linux package
        if: runner.os == 'Linux'
        run: |
          npm run install:local
          xvfb-run -a npm run smoke:local
          dbus-run-session -- xvfb-run -a npm run smoke:applications
          dbus-run-session -- xvfb-run -a npm run smoke:resident
          npm run smoke:personalization
          npm run smoke:customization
          npm run smoke:actions
          npm run smoke:picker
          npm run smoke:settings
          npm run smoke:search-cli
          npm run smoke:process
      - name: Upload checkpoint build artifacts (not a published release)
        uses: actions/upload-artifact@v4
        with:
          name: asaaan-launcher-checkpoint-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

[package]
name = "asaaan-launcher"
version = "0.1.1"
description = "Asaaan Launcher cross-platform desktop application"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asaaan_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
asaaan-extensions = { path = "../crates/launcher-extensions" }
dirs = "7"
tempfile = "3"
asaaan-personalization = { path = "../crates/launcher-personalization" }
asaaan-search = { path = "../crates/launcher-search" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
asaaan-lifecycle = { path = "../crates/launcher-lifecycle" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
asaaan-apps = { path = "../crates/launcher-apps" }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = "0.18"
gio = "0.18"
base64 = "0.22"
gdkx11 = "0.18"
x11rb = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
